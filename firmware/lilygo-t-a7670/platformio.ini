[env:lilygo-t-a7670]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../shared-libs
board_build.partitions = partitions_4mb.csv
board_build.filesystem = littlefs

build_flags =
  -D MOT_BOARD_LILYGO_T_A7670=1
  -D LILYGO_T_A7670
  -D LILYGO_GPS_SHIELD
  -D TINY_GSM_MODEM_A76XXSSL
  -D TINY_GSM_USE_GPRS=true
  -I include
  -I ../common
  ; Optional WiFi-first fallback:
  ; -D WIFI_SSID=\"YOUR_WIFI\"
  ; -D WIFI_PASS=\"YOUR_PASSWORD\"

lib_deps =
  ArduinoJson @ ^7.4.3
  mikalhart/TinyGPSPlus @ ^1.0.3
  PubSubClient @ ^2.8
  autowp/autowp-mcp2515 @ ^1.3.1
  https://github.com/lewisxhe/TinyGSM


[env:T-A7670X-AWS]
extends = env:lilygo-t-a7670
build_flags =
  ${env:lilygo-t-a7670.build_flags}
  -D MOT_AWS_IOT=1

[env:T-SIM7670G-S3-Standard-AWS]
platform = ${env:lilygo-t-a7670.platform}
board = esp32-s3-devkitc1-n16r2
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../shared-libs
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs

build_flags =
  -D MOT_BOARD_LILYGO_SIM7670G_S3=1
  -D MOT_BOARD=\"lilygo-t-sim7670g-s3-standard\"
  -D MOT_AWS_IOT=1
  -D TINY_GSM_MODEM_SIM7670G
  -D TINY_GSM_USE_GPRS=true
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D MOT_OFFLINE_CACHE_MAX_BYTES=262144
  -I include
  -I ../common

lib_deps =
  ArduinoJson @ ^7.4.3
  mikalhart/TinyGPSPlus @ ^1.0.3
  PubSubClient @ ^2.8
  autowp/autowp-mcp2515 @ ^1.3.1
  https://github.com/lewisxhe/TinyGSM
