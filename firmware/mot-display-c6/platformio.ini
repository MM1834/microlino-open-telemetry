[platformio]
default_envs = waveshare-esp32-c6-lcd-128

[env:waveshare-esp32-c6-lcd-128]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
build_src_filter =
  +<*>
  -<main_s3_185c.cpp>
  -<main_s3_dualeye_128.cpp>
build_flags =
  -I ../common
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=1
lib_deps =
  moononournation/GFX Library for Arduino @ 1.6.7
lib_ignore =
  MotDisplayS3Board

[env:waveshare-esp32-s3-dualeye-touch-lcd-128]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.memory_type = qio_opi
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
build_src_filter =
  -<*>
  +<main_s3_dualeye_128.cpp>
  +<mot_ble_client.cpp>
build_flags =
  -I ../common
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=1
  -D BOARD_HAS_PSRAM
  -D MOT_DISPLAY_INITIAL_PAIRING_MS=600000
lib_deps =
  moononournation/GFX Library for Arduino @ 1.6.7

[env:waveshare-esp32-s3-touch-lcd-185c-v2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.memory_type = qio_opi
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
build_src_filter =
  -<*>
  +<main_s3_185c.cpp>
  +<mot_ble_client.cpp>
build_flags =
  -I ../common
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=1
  -D BOARD_HAS_PSRAM
  -D LV_CONF_SKIP
  -D LV_COLOR_DEPTH=16
  -D LV_MEM_SIZE=65536
  -D LV_FONT_MONTSERRAT_16=1
  -D LV_FONT_MONTSERRAT_18=1
  -D LV_FONT_MONTSERRAT_20=1
  -D LV_FONT_MONTSERRAT_24=1
  -D LV_FONT_MONTSERRAT_28=1
  -D LV_FONT_MONTSERRAT_32=1
  -D LV_FONT_MONTSERRAT_48=1
  -D MOT_DISPLAY_S3_185C=1
  -D MOT_DISPLAY_INITIAL_PAIRING_MS=600000
  -D MOT_DISPLAY_SCAN_DIAGNOSTICS=1
lib_deps =
  lvgl/lvgl @ 9.2.2
