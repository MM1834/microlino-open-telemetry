<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">MOT ESP32-C6 Gen.2 Verdrahtungsplan</title>
  <desc id="desc">Verdrahtung eines nanoESP32-C6-N16 mit zwei 3,3-Volt-CAN-Transceivern, optionalem ATGM336H-5N-GPS, Stützkondensatoren und einer alternativ nutzbaren geschützten 12-Volt-auf-5-Volt-Versorgung über den internen 3,3-Volt-Regler.</desc>
  <defs>
    <style>
      .bg{fill:#f5f7fb}.panel{fill:#fff;stroke:#25324a;stroke-width:3}.soft{fill:#eef3fa;stroke:#6d7b94;stroke-width:2}
      .board{fill:#172235;stroke:#6ba7ff;stroke-width:4}.can{fill:#eef8f1;stroke:#2c7a4b;stroke-width:3}.gps{fill:#fff8e6;stroke:#b7791f;stroke-width:3}
      .power{fill:#edf6ff;stroke:#2474b5;stroke-width:3}.warn{fill:#fff0f0;stroke:#c62828;stroke-width:4}.note{fill:#fffbea;stroke:#aa7b00;stroke-width:2}
      .t{font-family:Inter,Arial,sans-serif;fill:#172235}.h1{font-size:34px;font-weight:800}.h2{font-size:23px;font-weight:750}.h3{font-size:18px;font-weight:750}.body{font-size:17px}.small{font-size:14px}.pin{font-size:15px;font-weight:700}
      .white{fill:#fff}.muted{fill:#536179}.red{fill:#b71c1c}.green{fill:#166534}.blue{fill:#155a93}
      .wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.signal{stroke:#6750a4}.pwr{stroke:#d32f2f}.gnd{stroke:#1f2937}.canh{stroke:#f07c00}.canl{stroke:#1685a9}.dash{stroke-dasharray:12 9}.thin{stroke-width:3}
    </style>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6750a4"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d32f2f"/></marker>
  </defs>

  <rect class="bg" width="1600" height="1120"/>
  <text class="t h1" x="55" y="58">MOT ESP32-C6 Gen.2 — Verdrahtungsplan</text>
  <text class="t body muted" x="55" y="90">nanoESP32-C6-N16 · Dual-CAN · optionales GPS · alternative 12-V-Fahrzeugversorgung</text>
  <text class="t small muted" x="1390" y="58">Rev. 0.1 · 2026-08-14</text>

  <!-- central board -->
  <rect class="board" x="570" y="210" width="460" height="585" rx="24"/>
  <text class="t h2 white" x="800" y="252" text-anchor="middle">nanoESP32-C6-N16</text>
  <text class="t body white" x="800" y="282" text-anchor="middle">MOT ESP32-C6 Gen.2</text>
  <rect x="720" y="306" width="160" height="58" rx="10" fill="#2a3953" stroke="#9cc4ff" stroke-width="2"/>
  <text class="t h3 white" x="800" y="342" text-anchor="middle">USB-C</text>
  <text class="t small white" x="800" y="388" text-anchor="middle">USB-Speisung / Programmierung</text>

  <!-- left pins -->
  <circle cx="590" cy="455" r="8" fill="#6750a4"/><text class="t pin white" x="612" y="461">GPIO1 · CAN1 TX</text>
  <circle cx="590" cy="500" r="8" fill="#6750a4"/><text class="t pin white" x="612" y="506">GPIO0 · CAN1 RX</text>
  <circle cx="590" cy="600" r="8" fill="#6750a4"/><text class="t pin white" x="612" y="606">GPIO3 · CAN2 TX</text>
  <circle cx="590" cy="645" r="8" fill="#6750a4"/><text class="t pin white" x="612" y="651">GPIO2 · CAN2 RX</text>

  <!-- right pins -->
  <circle cx="1010" cy="465" r="8" fill="#6750a4"/><text class="t pin white" x="988" y="471" text-anchor="end">GPIO21 · GPS TX</text>
  <circle cx="1010" cy="510" r="8" fill="#6750a4"/><text class="t pin white" x="988" y="516" text-anchor="end">GPIO20 · GPS RX</text>

  <!-- power pins -->
  <circle cx="600" cy="760" r="8" fill="#cbd5e1"/><text class="t pin white" x="620" y="767">GND</text>
  <circle cx="760" cy="760" r="8" fill="#d32f2f"/><text class="t pin white" x="780" y="767">3V3 OUT</text>
  <circle cx="970" cy="760" r="8" fill="#d32f2f"/><text class="t pin white" x="950" y="767" text-anchor="end">5V IN</text>
  <text class="t small white" x="860" y="728" text-anchor="middle">interner 5V→3V3-Regler</text>

  <!-- CAN1 -->
  <rect class="can" x="55" y="325" width="390" height="260" rx="18"/>
  <text class="t h2" x="250" y="362" text-anchor="middle">CAN-Transceiver 1 · 3,3 V</text>
  <text class="t small muted" x="250" y="386" text-anchor="middle">SN65HVD230 oder gleichwertig</text>
  <text class="t pin" x="415" y="438" text-anchor="end">TXD</text>
  <text class="t pin" x="415" y="483" text-anchor="end">RXD</text>
  <text class="t pin red" x="82" y="438">VCC 3V3</text>
  <text class="t pin" x="82" y="478">GND</text>
  <text class="t pin" x="82" y="525">CAN-H</text>
  <text class="t pin" x="300" y="525">CAN-L</text>
  <text class="t small muted" x="250" y="560" text-anchor="middle">CAN1 default: Standard-CAN V1 Pioneer</text>
  <path class="wire signal" d="M445 433 H590" marker-end="url(#arrow-purple)"/>
  <path class="wire signal" d="M590 500 H445" marker-end="url(#arrow-purple)"/>

  <!-- CAN2 -->
  <rect class="can" x="55" y="625" width="390" height="260" rx="18"/>
  <text class="t h2" x="250" y="662" text-anchor="middle">CAN-Transceiver 2 · 3,3 V</text>
  <text class="t small muted" x="250" y="686" text-anchor="middle">SN65HVD230 oder gleichwertig</text>
  <text class="t pin" x="415" y="738" text-anchor="end">TXD</text>
  <text class="t pin" x="415" y="783" text-anchor="end">RXD</text>
  <text class="t pin red" x="82" y="738">VCC 3V3</text>
  <text class="t pin" x="82" y="778">GND</text>
  <text class="t pin" x="82" y="825">CAN-H</text>
  <text class="t pin" x="300" y="825">CAN-L</text>
  <text class="t small muted" x="250" y="860" text-anchor="middle">CAN2 default: Display-CAN</text>
  <path class="wire signal" d="M445 733 H520 V600 H590" marker-end="url(#arrow-purple)"/>
  <path class="wire signal" d="M590 645 H500 V778 H445" marker-end="url(#arrow-purple)"/>

  <!-- bus outputs -->
  <path class="wire canh" d="M82 520 H35"/><path class="wire canl" d="M300 520 H250 V595 H35"/>
  <text class="t small" x="35" y="506">CAN1-Bus</text>
  <path class="wire canh" d="M82 820 H35"/><path class="wire canl" d="M300 820 H250 V895 H35"/>
  <text class="t small" x="35" y="806">CAN2-Bus</text>

  <!-- GPS -->
  <rect class="gps" x="1145" y="315" width="400" height="320" rx="18"/>
  <text class="t h2" x="1345" y="353" text-anchor="middle">Optionales GPS / GNSS</text>
  <text class="t body" x="1345" y="380" text-anchor="middle">ATGM336H-5N · UART 9600</text>
  <text class="t pin" x="1175" y="448">RX</text><text class="t pin" x="1175" y="493">TX</text>
  <text class="t pin red" x="1175" y="543">VCC 3V3</text><text class="t pin" x="1175" y="580">GND</text>
  <text class="t pin muted" x="1438" y="448">PPS · NC</text>
  <rect class="soft" x="1280" y="520" width="225" height="82" rx="10"/>
  <text class="t h3" x="1393" y="548" text-anchor="middle">direkt am GPS</text>
  <text class="t body" x="1393" y="578" text-anchor="middle">100 nF ∥ 47 µF</text>
  <path class="wire signal" d="M1010 465 H1175" marker-end="url(#arrow-purple)"/>
  <path class="wire signal" d="M1175 493 H1010" marker-end="url(#arrow-purple)"/>
  <path class="wire signal thin dash" d="M1505 418 H1540"/><text class="t small muted" x="1525" y="405" text-anchor="middle">IPEX-Patchantenne</text>

  <!-- rail and decoupling -->
  <path class="wire pwr" d="M760 760 V810 H535 V980 H1450"/>
  <path class="wire gnd" d="M600 760 V800 H520 V1005 H1450"/>
  <text class="t h3 red" x="1060" y="970">3V3-Sternversorgung</text>
  <text class="t h3" x="1060" y="1030">gemeinsame Masse / CAN-Bezugsmasse</text>
  <path class="wire pwr thin" d="M220 980 V738 H82"/><path class="wire gnd thin" d="M245 1005 V778 H82"/>
  <path class="wire pwr thin" d="M180 980 V438 H82"/><path class="wire gnd thin" d="M205 1005 V478 H82"/>
  <path class="wire pwr thin" d="M1225 980 V543 H1175"/><path class="wire gnd thin" d="M1250 1005 V580 H1175"/>
  <rect class="soft" x="275" y="900" width="255" height="68" rx="10"/>
  <text class="t h3" x="403" y="927" text-anchor="middle">CAN-Stützung</text>
  <text class="t small" x="403" y="952" text-anchor="middle">je 100 nF + gemeinsam 10 µF</text>

  <!-- power supply -->
  <rect class="power" x="1060" y="700" width="485" height="180" rx="18"/>
  <text class="t h2" x="1303" y="736" text-anchor="middle">Alternative 5-V-Fahrzeugversorgung</text>
  <text class="t body" x="1085" y="774">12 V → Sicherung 0,5–1 A → Verpol-/Transientenschutz</text>
  <text class="t body" x="1085" y="807">→ Automotive-Buck 5 V / ≥1 A → Schalter → N16 5V IN</text>
  <text class="t body" x="1085" y="840">Ausgang: 100 nF + 220 µF (gemäß Regler-Datenblatt)</text>
  <path class="wire pwr" d="M1060 790 H1040 V810 H970 V760" marker-end="url(#arrow-red)"/>

  <!-- warning -->
  <rect class="warn" x="570" y="825" width="455" height="130" rx="16"/>
  <text class="t h2 red" x="798" y="858" text-anchor="middle">⚠ WARNUNG ZUR SPEISUNG</text>
  <text class="t body red" x="798" y="888" text-anchor="middle">Externes 5V und USB-VBUS noch nicht parallel speisen!</text>
  <text class="t small" x="798" y="916" text-anchor="middle">Entweder USB oder externe 5V verwenden. Für USB-Debugging:</text>
  <text class="t small" x="798" y="939" text-anchor="middle">VBUS-Sperre/Datenkabel oder geprüften Power-Mux einsetzen.</text>

  <!-- termination warning -->
  <rect class="warn" x="55" y="1040" width="1490" height="68" rx="14"/>
  <text class="t h2 red" x="800" y="1068" text-anchor="middle">⚠ CAN-ABSCHLUSS: 120-Ω-WIDERSTÄNDE AUF DEN MODULEN ENTFERNEN ODER ABSCHALTEN</text>
  <text class="t body" x="800" y="1095" text-anchor="middle">Der Adapter ist ein Stich am bereits terminierten Fahrzeugbus. Fahrzeug AUS: CAN-H ↔ CAN-L sollte vor Anschluss normalerweise etwa 60 Ω messen.</text>
</svg>
