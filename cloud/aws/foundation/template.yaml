  LiveAuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-live-authorizer"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt LiveAuthorizerRole.Arn
      Environment:
        Variables:
          COGNITO_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${DashboardUserPool}"
          COGNITO_CLIENT_ID: !Ref DashboardUserPoolClient
          JWKS_CACHE_SECONDS: "3600"
      Code:
        ZipFile: |
          import base64
          import hashlib
          import json
          import os
          import time
          import urllib.request

          ISSUER = os.environ["COGNITO_ISSUER"].rstrip("/")
          CLIENT_ID = os.environ["COGNITO_CLIENT_ID"]
          JWKS_CACHE_SECONDS = int(os.environ.get("JWKS_CACHE_SECONDS", "3600"))
          JWKS_URL = f"{ISSUER}/.well-known/jwks.json"
          SHA256_DIGEST_INFO_PREFIX = bytes.fromhex("3031300d060960864801650304020105000420")
          _jwks_cache = {"expires_at": 0, "keys": {}}

          class Unauthorized(Exception):
              pass

          def b64url_decode(value):
              value = value.encode("ascii") if isinstance(value, str) else value
              return base64.urlsafe_b64decode(value + b"=" * (-len(value) % 4))

          def load_json_segment(segment):
              try:
                  return json.loads(b64url_decode(segment).decode("utf-8"))
              except (ValueError, UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise Unauthorized("invalid JWT encoding") from error

          def load_jwks(force_refresh=False):
              now = time.time()
              if not force_refresh and _jwks_cache["keys"] and now < _jwks_cache["expires_at"]:
                  return _jwks_cache["keys"]
              request = urllib.request.Request(JWKS_URL, headers={"Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=3) as response:
                  payload = json.load(response)
              keys = {item["kid"]: item for item in payload.get("keys", []) if item.get("kid")}
              if not keys:
                  raise Unauthorized("JWKS contains no signing keys")
              _jwks_cache["keys"] = keys
              _jwks_cache["expires_at"] = now + JWKS_CACHE_SECONDS
              return keys

          def verify_rs256(signing_input, signature, jwk):
              if jwk.get("kty") != "RSA" or jwk.get("alg", "RS256") != "RS256":
                  raise Unauthorized("unsupported signing key")
              modulus = int.from_bytes(b64url_decode(jwk["n"]), "big")
              exponent = int.from_bytes(b64url_decode(jwk["e"]), "big")
              key_size = (modulus.bit_length() + 7) // 8
              if len(signature) != key_size:
                  raise Unauthorized("invalid signature size")
              encoded = pow(int.from_bytes(signature, "big"), exponent, modulus).to_bytes(key_size, "big")
              digest_info = SHA256_DIGEST_INFO_PREFIX + hashlib.sha256(signing_input).digest()
              padding_length = key_size - len(digest_info) - 3
              expected = b"\x00\x01" + (b"\xff" * padding_length) + b"\x00" + digest_info
              if padding_length < 8 or encoded != expected:
                  raise Unauthorized("invalid JWT signature")

          def validate_access_token(token):
              parts = token.split(".")
              if len(parts) != 3:
                  raise Unauthorized("invalid JWT structure")
              header = load_json_segment(parts[0])
              claims = load_json_segment(parts[1])
              if header.get("alg") != "RS256" or not header.get("kid"):
                  raise Unauthorized("invalid JWT header")
              keys = load_jwks()
              jwk = keys.get(header["kid"])
              if not jwk:
                  jwk = load_jwks(force_refresh=True).get(header["kid"])
              if not jwk:
                  raise Unauthorized("unknown signing key")
              verify_rs256(f"{parts[0]}.{parts[1]}".encode("ascii"), b64url_decode(parts[2]), jwk)
              now = int(time.time())
              if claims.get("iss") != ISSUER:
                  raise Unauthorized("invalid issuer")
              if claims.get("token_use") != "access":
                  raise Unauthorized("access token required")
              if claims.get("client_id") != CLIENT_ID:
                  raise Unauthorized("invalid client")
              if not isinstance(claims.get("exp"), (int, float)) or int(claims["exp"]) <= now:
                  raise Unauthorized("token expired")
              if isinstance(claims.get("nbf"), (int, float)) and int(claims["nbf"]) > now:
                  raise Unauthorized("token not active")
              if not claims.get("sub"):
                  raise Unauthorized("subject missing")
              return claims

          def policy(principal, effect, resource, context=None):
              return {
                  "principalId": principal,
                  "policyDocument": {
                      "Version": "2012-10-17",
                      "Statement": [{
                          "Action": "execute-api:Invoke",
                          "Effect": effect,
                          "Resource": resource
                      }]
                  },
                  "context": context or {}
              }

          def handler(event, context):
              token = (event.get("queryStringParameters") or {}).get("access_token")
              if not token:
                  raise Exception("Unauthorized")
              try:
                  claims = validate_access_token(token)
                  return policy(claims["sub"], "Allow", event["methodArn"], {
                      "sub": claims["sub"],
                      "username": claims.get("username", ""),
                      "exp": int(claims["exp"])
                  })
              except Exception as error:
                  print(json.dumps({"event": "live_authorizer_denied", "reason": str(error)}))
                  raise Exception("Unauthorized")

  LiveHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-live-handler"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt LiveWebSocketRole.Arn
      Environment:
        Variables:
          CONNECTION_TABLE_NAME: !Ref LiveConnectionTable
          ACCESS_TABLE_NAME: !Ref UserVehicleAccessTable
          WEBSOCKET_API_ID: !Ref VehicleWebSocketApi
          WEBSOCKET_STAGE: "$default"
      Code:
        ZipFile: |
          import json
          import os
          import time
          import boto3
          from botocore.exceptions import ClientError

          table = boto3.resource("dynamodb").Table(os.environ["CONNECTION_TABLE_NAME"])
          access = boto3.resource("dynamodb").Table(os.environ["ACCESS_TABLE_NAME"])
          management = boto3.client(
              "apigatewaymanagementapi",
              endpoint_url=(
                  f"https://{os.environ['WEBSOCKET_API_ID']}.execute-api."
                  f"{os.environ['AWS_REGION']}.amazonaws.com/{os.environ['WEBSOCKET_STAGE']}"
              )
          )

          def response(status=200, body=None):
              return {"statusCode": status, "body": json.dumps(body or {"ok": True})}

          def send(connection_id, body):
              management.post_to_connection(
                  ConnectionId=connection_id,
                  Data=json.dumps(body, separators=(",", ":")).encode("utf-8")
              )

          def disconnect(cid):
              table.delete_item(Key={"connectionId": cid})
              try:
                  management.delete_connection(ConnectionId=cid)
              except ClientError:
                  pass

          def handler(event, context):
              request = event.get("requestContext", {})
              route = request.get("routeKey")
              connection_id = request.get("connectionId")

              if route == "$connect":
                  auth = request.get("authorizer") or {}
                  user_sub = str(auth.get("sub", "")).strip()
                  try:
                      token_expires_at = int(auth.get("exp", 0))
                  except (TypeError, ValueError):
                      token_expires_at = 0
                  now = int(time.time())
                  if not user_sub or token_expires_at <= now:
                      return response(401, {"error": "unauthorized"})
                  table.put_item(Item={
                      "connectionId": connection_id,
                      "userSub": user_sub,
                      "connectedAt": now,
                      "expiresAt": token_expires_at
                  })
                  return response()

              if route == "$disconnect":
                  table.delete_item(Key={"connectionId": connection_id})
                  return response()

              try:
                  body = json.loads(event.get("body") or "{}")
              except json.JSONDecodeError:
                  send(connection_id, {"type": "error", "error": "invalid_json"})
                  return response(400, {"error": "invalid_json"})

              if route == "subscribe":
                  vehicle_id = str(body.get("vehicleId", "")).strip()
                  if not vehicle_id:
                      send(connection_id, {"type": "error", "error": "vehicle_id_missing"})
                      return response(400, {"error": "vehicle_id_missing"})
                  connection = table.get_item(
                      Key={"connectionId": connection_id},
                      ConsistentRead=True
                  ).get("Item")
                  now = int(time.time())
                  if not connection or int(connection.get("expiresAt", 0)) <= now:
                      disconnect(connection_id)
                      return response(401, {"error": "unauthorized"})
                  assignment = access.get_item(
                      Key={
                          "userSub": connection.get("userSub", ""),
                          "vehicleId": vehicle_id
                      },
                          ConsistentRead=True
                      ).get("Item")
                  if not assignment or assignment.get("status") != "ACTIVE":
                      send(connection_id, {"type": "error", "error": "vehicle_not_found"})
                      return response(404, {"error": "vehicle_not_found"})
                  table.update_item(
                      Key={"connectionId": connection_id},
                      UpdateExpression="SET vehicleId=:v",
                      ExpressionAttributeValues={":v": vehicle_id}
                  )
                  send(connection_id, {"type": "subscribed", "vehicleId": vehicle_id})
                  return response()

              if route == "ping":
                  now = int(time.time())
                  connection = table.get_item(
                      Key={"connectionId": connection_id},
                      ConsistentRead=True
                  ).get("Item")
                  if not connection or int(connection.get("expiresAt", 0)) <= now:
                      disconnect(connection_id)
                      return response(401, {"error": "unauthorized"})
                  vehicle_id = str(connection.get("vehicleId", "")).strip()
                  if vehicle_id:
                      assignment = access.get_item(
                          Key={
                              "userSub": connection.get("userSub", ""),
                              "vehicleId": vehicle_id
                          },
                          ConsistentRead=True,
                          ProjectionExpression="#status",
                          ExpressionAttributeNames={"#status": "status"}
                      ).get("Item")
                      if not assignment or assignment.get("status") != "ACTIVE":
                          disconnect(connection_id)
                          return response(401, {"error": "unauthorized"})
                  send(connection_id, {"type": "pong", "serverTime": now})
                  return response()

              send(connection_id, {"type": "error", "error": "unsupported_action", "route": route})
              return response(400, {"error": "unsupported_action", "route": route})

