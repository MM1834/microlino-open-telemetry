  LiveWebSocketAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref VehicleWebSocketApi
      Name: !Sub "${ProjectName}-${Environment}-live-authorizer"
      AuthorizerType: REQUEST
      AuthorizerUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LiveAuthorizerFunction.Arn}/invocations"
      IdentitySource:
        - "route.request.querystring.access_token"

  LiveWebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref VehicleWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LiveHandlerFunction.Arn}/invocations"

  LiveConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref VehicleWebSocketApi
      RouteKey: "$connect"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LiveWebSocketAuthorizer
      Target: !Sub "integrations/${LiveWebSocketIntegration}"

  LiveDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref VehicleWebSocketApi
      RouteKey: "$disconnect"
      Target: !Sub "integrations/${LiveWebSocketIntegration}"

  LiveSubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref VehicleWebSocketApi
      RouteKey: "subscribe"
      Target: !Sub "integrations/${LiveWebSocketIntegration}"

  LivePingRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref VehicleWebSocketApi
      RouteKey: "ping"
      Target: !Sub "integrations/${LiveWebSocketIntegration}"

  LiveDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref VehicleWebSocketApi
      RouteKey: "$default"
      Target: !Sub "integrations/${LiveWebSocketIntegration}"

  LiveWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref VehicleWebSocketApi
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      Tags:
        project: !Ref ProjectName
        environment: !Ref Environment

  LiveHandlerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LiveHandlerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${VehicleWebSocketApi}/*"

  LiveAuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LiveAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${VehicleWebSocketApi}/*"

Outputs:
  CognitoUserPoolId:
    Description: Cognito user pool for dashboard users.
    Value: !Ref DashboardUserPool

  CognitoUserPoolArn:
    Description: ARN of the Cognito user pool.
    Value: !GetAtt DashboardUserPool.Arn

  CognitoIssuerUrl:
    Description: Issuer URL for the API Gateway JWT authorizer in SPR-0004B.2.
    Value: !Sub "https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${DashboardUserPool}"

  CognitoUserPoolClientId:
    Description: Public dashboard app client ID. This value is configuration, not a secret.
    Value: !Ref DashboardUserPoolClient

  CognitoDomainPrefix:
    Description: Globally unique Cognito managed-login domain prefix.
    Value: !Ref DashboardUserPoolDomain

  CognitoHostedUiBaseUrl:
    Description: Base URL of the Cognito managed login and OAuth endpoints.
    Value: !Sub "https://${DashboardUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"

  CognitoAuthorizationEndpoint:
    Description: OAuth 2.0 authorization endpoint for browser login.
    Value: !Sub "https://${DashboardUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize"

  CognitoTokenEndpoint:
    Description: OAuth 2.0 token endpoint for authorization-code exchange.
    Value: !Sub "https://${DashboardUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token"

  CognitoLogoutEndpoint:
    Description: Cognito logout endpoint.
    Value: !Sub "https://${DashboardUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/logout"

  StackRegion:
    Value: !Ref AWS::Region
  StateIngestRuleName:
    Value: !Ref StateIngestRule
  StateIngestFunctionName:
    Value: !Ref StateIngestFunction
  VehicleStateTableName:
    Value: !Ref VehicleStateTable
  VehicleStateTableArn:
    Value: !GetAtt VehicleStateTable.Arn
  VehicleHistoryTableName:
    Value: !Ref VehicleHistoryTable
  VehicleHistoryTableArn:
    Value: !GetAtt VehicleHistoryTable.Arn
  VehicleHistoryDailyWriteAlarmName:
    Value: !Ref VehicleHistoryDailyWriteAlarm
  UserVehicleAccessTableName:
    Description: Controlled user-to-vehicle assignment table for ONB-001.A.
    Value: !Ref UserVehicleAccessTable
  StateIngestLogGroupName:
    Value: !Ref StateIngestLogGroup


  VehicleApiId:
    Value: !Ref VehicleHttpApi
  
  VehicleApiBaseUrl:
    Value: !Sub "https://${VehicleHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  
  VehicleApiFunctionName:
    Value: !Ref VehicleApiFunction
  
  VehicleApiLogGroupName:
    Value: !Ref VehicleApiLogGroup

  VehicleWebSocketApiId:
    Value: !Ref VehicleWebSocketApi

  VehicleWebSocketUrl:
    Value: !Sub "wss://${VehicleWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/$default"

  LiveConnectionTableName:
    Value: !Ref LiveConnectionTable

  LiveHandlerFunctionName:
    Value: !Ref LiveHandlerFunction

  LiveAuthorizerFunctionName:
    Value: !Ref LiveAuthorizerFunction
