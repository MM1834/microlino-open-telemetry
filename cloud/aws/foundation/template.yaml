AWSTemplateFormatVersion: "2010-09-09"
Description: MOT AWS foundation with vehicle state and Cognito user authentication.

Parameters:
  ProjectName:
    Type: String
    Default: mot
  Environment:
    Type: String
    Default: dev
  TopicFilter:
    Type: String
    Default: "mot/#"
  LogRetentionDays:
    Type: Number
    Default: 7
  EnableVerboseMessageLogs:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  EnableTelemetryHistory:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enables the bounded pilot history side path. Live state remains independent.

  EnableHistoryMotionSignals:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Adds speed after the SOC/charging pilot gate passes.

  HistoryVehicleAllowlist:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-z0-9][a-z0-9_-]{0,63}(,[a-z0-9][a-z0-9_-]{0,63})*$'
    Description: Comma-separated pilot vehicles. Empty means no history writes.

  HistoryRetentionDays:
    Type: Number
    Default: 31
    MinValue: 1
    MaxValue: 31
    Description: DynamoDB TTL horizon for pilot history. Capped at 31 days.

  HistoryCoreIntervalSeconds:
    Type: Number
    Default: 300
    AllowedValues: [60, 300, 900, 1800, 3600]
    Description: Bucket interval for SOC, charging state and plugged state.

  HistoryMotionIntervalSeconds:
    Type: Number
    Default: 60
    AllowedValues: [60, 300, 900, 1800, 3600]
    Description: Active-driving sample interval for speed. Repeated standstill zeroes are suppressed.

  HistoryDailyWriteAlarmThreshold:
    Type: Number
    Default: 1000
    MinValue: 1
    Description: Alarm when history table writes exceed this daily pilot budget.


  ApiAllowedOrigin:
    Type: String
    AllowedPattern: '^(https://[^*\s]+|http://localhost(:[0-9]+)?)$'
    ConstraintDescription: Use one exact HTTPS origin or localhost for development.
    Description: >
      Exact CORS origin for the authenticated portal, including scheme and host.
      Wildcard origins are not permitted by the ONB-001 deployment process.
  
  ApiLogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

  CognitoSelfRegistrationEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Enables public user sign-up. Keep disabled until the end-user onboarding
      and abuse-prevention flows are implemented.

  CognitoDeletionProtection:
    Type: String
    Default: ACTIVE
    AllowedValues: [ACTIVE, INACTIVE]
    Description: Protects the user pool from accidental deletion.

  CognitoDashboardCallbackUrls:
    Type: CommaDelimitedList
    Description: >
      Allowed OAuth callback URLs for the dashboard app client. Use HTTPS for
      deployed environments; localhost HTTP is reserved for local development.

  CognitoDashboardLogoutUrls:
    Type: CommaDelimitedList
    Description: >
      Allowed post-logout redirect URLs for the dashboard app client.

Conditions:
  CognitoSelfRegistrationIsEnabled: !Equals
    - !Ref CognitoSelfRegistrationEnabled
    - "true"
  TelemetryHistoryIsEnabled: !Equals
    - !Ref EnableTelemetryHistory
    - "true"

Resources:
  DashboardUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-${Environment}-dashboard-users"
      DeletionProtection: !Ref CognitoDeletionProtection
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "OFF"
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: !If
          - CognitoSelfRegistrationIsEnabled
          - false
          - true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      UserPoolTags:
        project: !Ref ProjectName
        environment: !Ref Environment
        component: identity


  DashboardUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-${Environment}-dashboard"
      UserPoolId: !Ref DashboardUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs: !Ref CognitoDashboardCallbackUrls
      LogoutURLs: !Ref CognitoDashboardLogoutUrls
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  DashboardUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${ProjectName}-${Environment}-${AWS::AccountId}-${AWS::Region}"
      UserPoolId: !Ref DashboardUserPool

  VehicleStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-vehicle-state"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: vehicleId
          AttributeType: S
        - AttributeName: topicSuffix
          AttributeType: S
      KeySchema:
        - AttributeName: vehicleId
          KeyType: HASH
        - AttributeName: topicSuffix
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: environment
          Value: !Ref Environment

  VehicleHistoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-vehicle-history"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: vehicleId
          AttributeType: S
        - AttributeName: sampleKey
          AttributeType: S
      KeySchema:
        - AttributeName: vehicleId
          KeyType: HASH
        - AttributeName: sampleKey
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: environment
          Value: !Ref Environment
        - Key: component
          Value: telemetry-history-pilot

  VehicleHistoryDailyWriteAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-history-daily-writes"
      AlarmDescription: Pilot guardrail; investigate before enabling more vehicles.
      Namespace: AWS/DynamoDB
      MetricName: ConsumedWriteCapacityUnits
      Dimensions:
        - Name: TableName
          Value: !Ref VehicleHistoryTable
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref HistoryDailyWriteAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  UserVehicleAccessTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-user-vehicle-access"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userSub
          AttributeType: S
        - AttributeName: vehicleId
          AttributeType: S
      KeySchema:
        - AttributeName: userSub
          KeyType: HASH
        - AttributeName: vehicleId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: environment
          Value: !Ref Environment

  LiveConnectionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-live-connections"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: vehicleId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: vehicleId-index
          KeySchema:
            - AttributeName: vehicleId
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: environment
          Value: !Ref Environment

  StateIngestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-state-ingest-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: [sts:AssumeRole]
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: vehicle-state-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:UpdateItem]
                Resource: !GetAtt VehicleStateTable.Arn
              - !If
                - TelemetryHistoryIsEnabled
                - Effect: Allow
                  Action: [dynamodb:PutItem]
                  Resource: !GetAtt VehicleHistoryTable.Arn
                - !Ref AWS::NoValue
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt LiveConnectionTable.Arn
                  - !Sub "${LiveConnectionTable.Arn}/index/vehicleId-index"
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !GetAtt UserVehicleAccessTable.Arn
              - Effect: Allow
                Action: [execute-api:ManageConnections]
                Resource: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${VehicleWebSocketApi}/*"

  StateIngestFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-state-ingest"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt StateIngestRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref VehicleStateTable
          CONNECTION_TABLE_NAME: !Ref LiveConnectionTable
          ACCESS_TABLE_NAME: !Ref UserVehicleAccessTable
          WEBSOCKET_API_ID: !Ref VehicleWebSocketApi
          WEBSOCKET_STAGE: "$default"
          VERBOSE_MESSAGE_LOGS: !Ref EnableVerboseMessageLogs
          HISTORY_ENABLED: !Ref EnableTelemetryHistory
          HISTORY_TABLE_NAME: !Ref VehicleHistoryTable
          HISTORY_RETENTION_DAYS: !Ref HistoryRetentionDays
          HISTORY_MOTION_ENABLED: !Ref EnableHistoryMotionSignals
          HISTORY_VEHICLE_ALLOWLIST: !Ref HistoryVehicleAllowlist
          HISTORY_CORE_INTERVAL_SECONDS: !Ref HistoryCoreIntervalSeconds
          HISTORY_MOTION_INTERVAL_SECONDS: !Ref HistoryMotionIntervalSeconds
      Code:
        ZipFile: |
          import base64
          import json
          import os
          import time
          from decimal import Decimal
          import boto3
          from boto3.dynamodb.conditions import Key
          from botocore.exceptions import ClientError

          dynamodb = boto3.resource("dynamodb")
          table = dynamodb.Table(os.environ["TABLE_NAME"])
          connections = dynamodb.Table(os.environ["CONNECTION_TABLE_NAME"])
          access = dynamodb.Table(os.environ["ACCESS_TABLE_NAME"])
          history = dynamodb.Table(os.environ["HISTORY_TABLE_NAME"])
          management = boto3.client(
              "apigatewaymanagementapi",
              endpoint_url=(
                  f"https://{os.environ['WEBSOCKET_API_ID']}.execute-api."
                  f"{os.environ['AWS_REGION']}.amazonaws.com/{os.environ['WEBSOCKET_STAGE']}"
              )
          )
          verbose = os.environ.get("VERBOSE_MESSAGE_LOGS", "false").lower() == "true"
          history_enabled = os.environ.get("HISTORY_ENABLED", "false").lower() == "true"
          history_motion_enabled = os.environ.get("HISTORY_MOTION_ENABLED", "false").lower() == "true"
          history_vehicle_allowlist = {
              item.strip() for item in os.environ.get("HISTORY_VEHICLE_ALLOWLIST", "").split(",")
              if item.strip()
          }
          history_retention_days = min(31, max(1, int(os.environ.get("HISTORY_RETENTION_DAYS", "31"))))
          history_core_interval = int(os.environ.get("HISTORY_CORE_INTERVAL_SECONDS", "300"))
          history_motion_interval = int(os.environ.get("HISTORY_MOTION_INTERVAL_SECONDS", "60"))

          HISTORY_SIGNALS = {
              "display/soc": ("soc", history_core_interval),
              "charging/is_charging": ("charging", history_core_interval),
              "charging/plugged": ("plugged", history_core_interval),
              "display/speed_kmh": ("speed", history_motion_interval),
              "display/speed": ("speed", history_motion_interval),
          }

          def is_history_candidate(vehicle_id, topic_suffix):
              if (
                  not history_enabled
                  or vehicle_id not in history_vehicle_allowlist
                  or topic_suffix not in HISTORY_SIGNALS
              ):
                  return False
              signal = HISTORY_SIGNALS[topic_suffix][0]
              return signal != "speed" or history_motion_enabled

          def store_history(
              vehicle_id, topic_suffix, value, value_type, received_at,
              previous_received_at=0, previous_value=None
          ):
              if not is_history_candidate(vehicle_id, topic_suffix):
                  return False
              signal, interval_seconds = HISTORY_SIGNALS[topic_suffix]
              if signal in ("charging", "plugged") and not isinstance(value, bool):
                  return False
              if signal not in ("charging", "plugged") and not isinstance(value, (int, Decimal)):
                  return False
              received_seconds = received_at // 1000
              bucket = received_seconds - (received_seconds % interval_seconds)
              previous_seconds = int(previous_received_at or 0) // 1000
              speed_stopped = signal == "speed" and value == 0
              speed_was_moving = (
                  signal == "speed"
                  and isinstance(previous_value, (int, Decimal))
                  and previous_value > 0
              )
              if speed_stopped and not speed_was_moving:
                  return False
              if speed_stopped:
                  # Preserve the end of a drive even if it occurs inside an
                  # already sampled minute. Continuous standstill writes are
                  # suppressed above.
                  bucket = received_seconds
              elif previous_seconds - (previous_seconds % interval_seconds) == bucket:
                  return False
              try:
                  history.put_item(
                      Item={
                          "vehicleId": vehicle_id,
                          "sampleKey": f"{signal}#{bucket:010d}",
                          "signal": signal,
                          "sampledAt": bucket * 1000,
                          "receivedAt": received_at,
                          "value": value,
                          "valueType": value_type,
                          "expiresAt": bucket + history_retention_days * 86400,
                      },
                      ConditionExpression="attribute_not_exists(sampleKey)"
                  )
                  return True
              except ClientError as error:
                  if error.response.get("Error", {}).get("Code") == "ConditionalCheckFailedException":
                      return False
                  raise

          def disconnect(cid):
              connections.delete_item(Key={"connectionId": cid})
              try:
                  management.delete_connection(ConnectionId=cid)
              except ClientError:
                  pass

          def decode_payload(encoded):
              raw = base64.b64decode(encoded or "")
              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError:
                  return "binary", base64.b64encode(raw).decode("ascii"), None, len(raw)
              try:
                  value = json.loads(text, parse_float=Decimal)
                  if isinstance(value, dict): kind = "json_object"
                  elif isinstance(value, list): kind = "json_array"
                  elif isinstance(value, bool): kind = "boolean"
                  elif isinstance(value, (int, Decimal)): kind = "number"
                  elif value is None: kind = "null"
                  else: kind = "string"
                  return kind, value, text, len(raw)
              except json.JSONDecodeError:
                  return "text", text, text, len(raw)

          def json_value(value):
              if isinstance(value, Decimal):
                  return int(value) if value == value.to_integral_value() else float(value)
              if isinstance(value, list):
                  return [json_value(item) for item in value]
              if isinstance(value, dict):
                  return {key: json_value(item) for key, item in value.items()}
              return value

          def broadcast_live_update(vehicle_id, topic, topic_suffix, value, value_type, received_at):
              result = connections.query(
                  IndexName="vehicleId-index",
                  KeyConditionExpression=Key("vehicleId").eq(vehicle_id),
                  ProjectionExpression="connectionId"
              )
              connection_keys = result.get("Items", [])
              if not connection_keys:
                  return {"sent": 0, "removed": 0}

              payload = json.dumps({
                  "type": "telemetry",
                  "vehicleId": vehicle_id,
                  "topic": topic,
                  "topicSuffix": topic_suffix,
                  "value": json_value(value),
                  "valueType": value_type,
                  "receivedAt": received_at
              }, separators=(",", ":")).encode("utf-8")

              sent = 0
              removed = 0
              now = int(time.time())
              for connection_key in connection_keys:
                  connection_id = connection_key.get("connectionId")
                  if not connection_id:
                      continue
                  connection = connections.get_item(
                      Key={"connectionId": connection_id},
                      ConsistentRead=True
                  ).get("Item", {})
                  user_sub = str(connection.get("userSub", "")).strip()
                  expires_at = int(connection.get("expiresAt", 0))
                  if not user_sub or expires_at <= now:
                      disconnect(connection_id)
                      removed += 1
                      continue
                  assignment = access.get_item(
                      Key={"userSub": user_sub, "vehicleId": vehicle_id},
                      ConsistentRead=True,
                      ProjectionExpression="#status",
                      ExpressionAttributeNames={"#status": "status"}
                  ).get("Item")
                  if not assignment or assignment.get("status") != "ACTIVE":
                      disconnect(connection_id)
                      removed += 1
                      continue
                  try:
                      management.post_to_connection(ConnectionId=connection_id, Data=payload)
                      sent += 1
                  except ClientError as error:
                      code = error.response.get("Error", {}).get("Code")
                      status = error.response.get("ResponseMetadata", {}).get("HTTPStatusCode")
                      if code == "GoneException" or status == 410:
                          connections.delete_item(Key={"connectionId": connection_id})
                          removed += 1
                      else:
                          print(json.dumps({
                              "eventType": "live_fanout_error",
                              "vehicleId": vehicle_id,
                              "connectionId": connection_id,
                              "error": str(error)
                          }, separators=(",", ":")))
              return {"sent": sent, "removed": removed}

          def handler(event, context):
              topic = str(event.get("mqttTopic", ""))
              parts = topic.split("/")
              if len(parts) < 3 or parts[0] != "mot":
                  return {"accepted": False, "reason": "invalid_topic"}

              received_at = int(event.get("receivedAt") or time.time() * 1000)
              vehicle_id = parts[1]
              topic_suffix = "/".join(parts[2:])
              category = parts[2]
              value_type, value, payload_text, payload_bytes = decode_payload(event.get("payloadBase64"))

              try:
                  update_result = table.update_item(
                      Key={"vehicleId": vehicle_id, "topicSuffix": topic_suffix},
                      UpdateExpression=(
                          "SET #v=:v, valueType=:t, receivedAt=:r, fullTopic=:f, "
                          "category=:c, payloadBytes=:b, payloadText=:p"
                      ),
                      ConditionExpression="attribute_not_exists(receivedAt) OR receivedAt <= :r",
                      ExpressionAttributeNames={"#v": "value"},
                      ExpressionAttributeValues={
                          ":v": value,
                          ":t": value_type,
                          ":r": received_at,
                          ":f": topic,
                          ":c": category,
                          ":b": payload_bytes,
                          ":p": payload_text or ""
                      },
                      ReturnValues=(
                          "ALL_OLD" if is_history_candidate(vehicle_id, topic_suffix)
                          else "NONE"
                      )
                  )
                  stored = True
                  previous_received_at = int(
                      update_result.get("Attributes", {}).get("receivedAt", 0)
                  )
                  previous_value = update_result.get("Attributes", {}).get("value")
              except ClientError as error:
                  if error.response.get("Error", {}).get("Code") == "ConditionalCheckFailedException":
                      stored = False
                  else:
                      print(json.dumps({"eventType":"state_ingest_error","topic":topic,"error":str(error)}))
                      raise

              fanout = {"sent": 0, "removed": 0}
              history_stored = False
              if stored:
                  try:
                      history_stored = store_history(
                          vehicle_id, topic_suffix, value, value_type, received_at,
                          previous_received_at, previous_value
                      )
                  except Exception as error:
                      print(json.dumps({
                          "eventType": "history_ingest_failed",
                          "vehicleId": vehicle_id,
                          "topicSuffix": topic_suffix,
                          "error": str(error)
                      }, separators=(",", ":")))
                  try:
                      fanout = broadcast_live_update(
                          vehicle_id, topic, topic_suffix, value, value_type, received_at
                      )
                  except Exception as error:
                      print(json.dumps({
                          "eventType": "live_fanout_failed",
                          "vehicleId": vehicle_id,
                          "topicSuffix": topic_suffix,
                          "error": str(error)
                      }, separators=(",", ":")))

              if verbose:
                  print(json.dumps({
                      "eventType":"state_updated",
                      "vehicleId":vehicle_id,
                      "topicSuffix":topic_suffix,
                      "valueType":value_type,
                      "receivedAt":received_at,
                      "stored":stored,
                      "historyStored":history_stored,
                      "liveSent":fanout["sent"],
                      "staleConnectionsRemoved":fanout["removed"]
                  }, default=str, separators=(",", ":")))

              return {"accepted": True, "stored": stored, "historyStored": history_stored, "live": fanout}

  StateIngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StateIngestFunction}"
      RetentionInDays: !Ref LogRetentionDays

  IoTInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StateIngestFunction
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:rule/${ProjectName}_${Environment}_state"

  StateIngestRule:
    Type: AWS::IoT::TopicRule
    DependsOn: [IoTInvokePermission, StateIngestLogGroup]
    Properties:
      RuleName: !Sub "${ProjectName}_${Environment}_state"
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Sql: !Sub >
          SELECT topic() AS mqttTopic,
                 timestamp() AS receivedAt,
                 encode(*, 'base64') AS payloadBase64
          FROM '${TopicFilter}'
        Actions:
          - Lambda:
              FunctionArn: !GetAtt StateIngestFunction.Arn


  VehicleApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-vehicle-api-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: !Sub "${ProjectName}-${Environment}-vehicle-state-read"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !GetAtt VehicleStateTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !GetAtt VehicleHistoryTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                Resource: !GetAtt UserVehicleAccessTable.Arn
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: environment
          Value: !Ref Environment
  
  VehicleApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-vehicle-api"
      Description: Read-only beta API for MOT multi-vehicle current state.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt VehicleApiRole.Arn
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          ENVIRONMENT: !Ref Environment
          TABLE_NAME: !Ref VehicleStateTable
          ACCESS_TABLE_NAME: !Ref UserVehicleAccessTable
          HISTORY_TABLE_NAME: !Ref VehicleHistoryTable
          HISTORY_RETENTION_DAYS: !Ref HistoryRetentionDays
      Code:
        ZipFile: |
          import json
          import os
          import time
          from decimal import Decimal
  
          import boto3
          from boto3.dynamodb.conditions import Key
  
          PROJECT = os.environ.get("PROJECT_NAME", "mot")
          ENVIRONMENT = os.environ.get("ENVIRONMENT", "dev")
          TABLE_NAME = os.environ["TABLE_NAME"]
          HISTORY_RETENTION_DAYS = min(31, max(1, int(os.environ.get("HISTORY_RETENTION_DAYS", "31"))))
  
          table = boto3.resource("dynamodb").Table(TABLE_NAME)
          history = boto3.resource("dynamodb").Table(os.environ["HISTORY_TABLE_NAME"])
          access = boto3.resource("dynamodb").Table(
              os.environ["ACCESS_TABLE_NAME"]
          )
  
          def json_value(value):
              if isinstance(value, Decimal):
                  return int(value) if value % 1 == 0 else float(value)
              if isinstance(value, list):
                  return [json_value(item) for item in value]
              if isinstance(value, dict):
                  return {
                      key: json_value(item)
                      for key, item in value.items()
                  }
              return value
  
          def response(status_code, body):
              return {
                  "statusCode": status_code,
                  "headers": {
                      "content-type": "application/json; charset=utf-8",
                      "cache-control": "no-store"
                  },
                  "body": json.dumps(
                      body,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )
              }
  
          def route_key(event):
              return (
                  event.get("requestContext", {})
                  .get("http", {})
                  .get("method", "GET")
                  + " "
                  + event.get("rawPath", "/")
              )
  
          def load_vehicle(vehicle_id):
              result = table.query(
                  KeyConditionExpression=Key("vehicleId").eq(vehicle_id),
                  ConsistentRead=True
              )
  
              items = result.get("Items", [])
              values = {}
              metadata = {}
              newest_received_at = 0
  
              for item in items:
                  suffix = item["topicSuffix"]
                  received_at = int(item.get("receivedAt", 0))
                  newest_received_at = max(
                      newest_received_at,
                      received_at
                  )
  
                  values[suffix] = json_value(item.get("value"))
                  metadata[suffix] = {
                      "receivedAt": received_at,
                      "valueType": item.get("valueType", "unknown"),
                      "payloadBytes": int(item.get("payloadBytes", 0))
                  }
  
              if not items:
                  return None
  
              return {
                  "vehicleId": vehicle_id,
                  "updatedAt": newest_received_at,
                  "online": values.get("status/online"),
                  "lastSeenUtc": values.get(
                      "system/last_seen_utc"
                  ),
                  "values": values,
                  "metadata": metadata
              }
  
          def caller_sub(event):
              claims = (
                  event.get("requestContext", {})
                  .get("authorizer", {})
                  .get("jwt", {})
                  .get("claims", {})
              )
              return str(claims.get("sub", "")).strip()

          def has_active_access(user_sub, vehicle_id):
              result = access.get_item(
                  Key={"userSub": user_sub, "vehicleId": vehicle_id},
                  ConsistentRead=True,
                  ProjectionExpression="#status",
                  ExpressionAttributeNames={"#status": "status"}
              )
              return result.get("Item", {}).get("status") == "ACTIVE"

          def list_vehicle_ids(user_sub):
              vehicle_ids = []
              last_evaluated_key = None

              while True:
                  kwargs = {
                      "KeyConditionExpression": Key("userSub").eq(user_sub),
                      "ProjectionExpression": "vehicleId,#status",
                      "ExpressionAttributeNames": {"#status": "status"},
                      "ConsistentRead": True
                  }
                  if last_evaluated_key:
                      kwargs["ExclusiveStartKey"] = (
                          last_evaluated_key
                      )
  
                  result = access.query(**kwargs)
                  for item in result.get("Items", []):
                      if item.get("status") == "ACTIVE" and item.get("vehicleId"):
                          vehicle_ids.append(item["vehicleId"])
  
                  last_evaluated_key = result.get(
                      "LastEvaluatedKey"
                  )
                  if not last_evaluated_key:
                      break
  
              return sorted(set(vehicle_ids))

          def list_vehicles(user_sub):
              vehicles = []
              for vehicle_id in list_vehicle_ids(user_sub):
                  snapshot = load_vehicle(vehicle_id)
                  if snapshot:
                      vehicles.append({
                          "vehicleId": vehicle_id,
                          "online": snapshot.get("online"),
                          "lastSeenUtc": snapshot.get(
                              "lastSeenUtc"
                          ),
                          "updatedAt": snapshot.get("updatedAt")
                      })
  
              return vehicles

          def load_history(vehicle_id, since_ms, until_ms, resolution_seconds):
              signals = ("soc", "charging", "plugged", "speed")
              buckets = {}
              speed_buckets = {}
              for signal in signals:
                  lower = f"{signal}#{since_ms // 1000:010d}"
                  upper = f"{signal}#{until_ms // 1000:010d}"
                  last_evaluated_key = None
                  while True:
                      kwargs = {
                          "KeyConditionExpression": (
                              Key("vehicleId").eq(vehicle_id)
                              & Key("sampleKey").between(lower, upper)
                          ),
                          "ConsistentRead": False
                      }
                      if last_evaluated_key:
                          kwargs["ExclusiveStartKey"] = last_evaluated_key
                      result = history.query(**kwargs)
                      for item in result.get("Items", []):
                          sampled_at = int(item.get("sampledAt", 0))
                          bucket_ms = (sampled_at // (resolution_seconds * 1000)) * resolution_seconds * 1000
                          point = buckets.setdefault(bucket_ms, {"ts": bucket_ms})
                          value = json_value(item.get("value"))
                          if signal == "speed" and isinstance(value, (int, float)):
                              aggregate = speed_buckets.setdefault(
                                  bucket_ms, {"sum": 0.0, "count": 0, "max": 0.0}
                              )
                              aggregate["sum"] += value
                              aggregate["count"] += 1
                              aggregate["max"] = max(aggregate["max"], value)
                          else:
                              point[signal] = value
                      last_evaluated_key = result.get("LastEvaluatedKey")
                      if not last_evaluated_key:
                          break
              for bucket_ms, aggregate in speed_buckets.items():
                  point = buckets.setdefault(bucket_ms, {"ts": bucket_ms})
                  point["speed"] = round(
                      aggregate["sum"] / aggregate["count"], 1
                  )
                  point["speedMax"] = aggregate["max"]
              return [buckets[key] for key in sorted(buckets)]
  
          def handler(event, context):
              method = (
                  event.get("requestContext", {})
                  .get("http", {})
                  .get("method", "GET")
              )
              path = event.get("rawPath", "/")
              path_parameters = event.get(
                  "pathParameters"
              ) or {}
  
              if method == "GET" and path == "/health":
                  return response(200, {
                      "ok": True,
                      "service": "mot-vehicle-api",
                      "project": PROJECT,
                      "environment": ENVIRONMENT,
                      "utc": int(time.time())
                  })

              user_sub = caller_sub(event)
              if not user_sub:
                  return response(401, {"error": "unauthorized"})
  
              if method == "GET" and path == "/api/vehicles":
                  vehicles = list_vehicles(user_sub)
                  return response(200, {
                      "count": len(vehicles),
                      "vehicles": vehicles
                  })
  
              if (
                  method == "GET"
                  and path.startswith("/api/vehicles/")
                  and path.endswith("/snapshot")
              ):
                  vehicle_id = path_parameters.get("vehicleId")
                  if not vehicle_id:
                      return response(400, {
                          "error": "vehicle_id_missing"
                      })

                  if not has_active_access(user_sub, vehicle_id):
                      return response(404, {
                          "error": "vehicle_not_found"
                      })
  
                  snapshot = load_vehicle(vehicle_id)
                  if snapshot is None:
                      return response(404, {
                          "error": "vehicle_not_found",
                          "vehicleId": vehicle_id
                      })
  
                  return response(200, snapshot)

              if (
                  method == "GET"
                  and path.startswith("/api/vehicles/")
                  and path.endswith("/history")
              ):
                  vehicle_id = path_parameters.get("vehicleId")
                  if not vehicle_id or not has_active_access(user_sub, vehicle_id):
                      return response(404, {"error": "vehicle_not_found"})
                  query = event.get("queryStringParameters") or {}
                  try:
                      hours = int(query.get("hours", "24"))
                  except (TypeError, ValueError):
                      return response(400, {"error": "invalid_hours"})
                  if hours not in (24, 168, 720):
                      return response(400, {"error": "unsupported_range"})
                  resolution_seconds = {24: 300, 168: 1800, 720: 7200}[hours]
                  until_ms = int(time.time() * 1000)
                  since_ms = until_ms - hours * 3600000
                  points = load_history(vehicle_id, since_ms, until_ms, resolution_seconds)
                  return response(200, {
                      "vehicleId": vehicle_id,
                      "hours": hours,
                      "resolutionSeconds": resolution_seconds,
                      "retentionDays": HISTORY_RETENTION_DAYS,
                      "count": len(points),
                      "points": points
                  })
  
              return response(404, {
                  "error": "route_not_found",
                  "method": method,
                  "path": path,
                  "routeKey": route_key(event)
              })
