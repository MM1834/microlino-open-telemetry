AWSTemplateFormatVersion: "2010-09-09"
Description: MOT ONB-001.B2 isolated claim backend.

Parameters:
  ProjectName:
    Type: String
    Default: mot
  Environment:
    Type: String
    Default: dev
  ApiAllowedOrigin:
    Type: String
    AllowedPattern: '^(https://[^*\s]+|http://localhost(:[0-9]+)?)$'
  CognitoIssuerUrl:
    Type: String
  CognitoUserPoolId:
    Type: String
  CognitoUserPoolClientId:
    Type: String
  VehicleStateTableName:
    Type: String
  UserVehicleAccessTableName:
    Type: String
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  FirmwareArtifactKey:
    Type: String
    Default: ""
    AllowedPattern: '^$|^releases/(nanoesp32c6-n16|xiao-esp32c6)/[A-Za-z0-9._/-]+\.bin$'
  FirmwareTarget:
    Type: String
    Default: nanoesp32c6-n16
    AllowedValues: [nanoesp32c6-n16, xiao-esp32c6]
  FirmwareFlashSizeBytes:
    Type: Number
    Default: 16777216
    AllowedValues: [4194304, 16777216]
  FirmwareVersion:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
  FirmwareSha256:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[0-9a-f]{64}$'
  FirmwareSize:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 5242880
  FirmwareSecondaryArtifactKey:
    Type: String
    Default: ""
    AllowedPattern: '^$|^releases/(nanoesp32c6-n16|xiao-esp32c6)/[A-Za-z0-9._/-]+\.bin$'
  FirmwareSecondaryTarget:
    Type: String
    Default: ""
    AllowedValues: ["", nanoesp32c6-n16, xiao-esp32c6]
  FirmwareSecondaryFlashSizeBytes:
    Type: Number
    Default: 0
    AllowedValues: [0, 4194304, 16777216]
  FirmwareSecondaryVersion:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
  FirmwareSecondarySha256:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[0-9a-f]{64}$'
  FirmwareSecondarySize:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 5242880
  FirmwareUrlTtlSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 300
  AdminGroupName:
    Type: String
    Default: mot-beta-admins
  ClaimTtlSeconds:
    Type: Number
    Default: 86400
    MinValue: 900
    MaxValue: 604800
  MaxClaimAttempts:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 10
  ClaimReadOnlyVehicleIds:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-z0-9][a-z0-9-]{0,63}(,[a-z0-9][a-z0-9-]{0,63})*$'
    Description: Users with ACTIVE access to one of these vehicles cannot consume claims.
  AuditRetentionDays:
    Type: Number
    AllowedValues: [30, 90, 180, 365]
    Description: Explicit privacy and support retention decision for onboarding audit events.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]

Resources:
  OnboardingAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: !Ref AdminGroupName
      Description: Maintainers allowed to issue controlled beta claims.
      UserPoolId: !Ref CognitoUserPoolId
  ClaimsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-onboarding-claims"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: claimId, AttributeType: S}]
      KeySchema: [{AttributeName: claimId, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  VehicleOwnershipTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-vehicle-ownership"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: vehicleId, AttributeType: S}]
      KeySchema: [{AttributeName: vehicleId, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true}
  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-onboarding-audit"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: entityId, AttributeType: S}
        - {AttributeName: eventKey, AttributeType: S}
      KeySchema:
        - {AttributeName: entityId, KeyType: HASH}
        - {AttributeName: eventKey, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  FirmwareGrantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-firmware-grants"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: userSub, AttributeType: S}
        - {AttributeName: target, AttributeType: S}
      KeySchema:
        - {AttributeName: userSub, KeyType: HASH}
        - {AttributeName: target, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  FirmwareArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-firmware
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref ApiAllowedOrigin]
            AllowedMethods: [GET]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 300
  OnboardingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: onboarding-data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:PutItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt ClaimsTable.Arn
                  - !GetAtt VehicleOwnershipTable.Arn
                  - !GetAtt AuditTable.Arn
                  - !GetAtt FirmwareGrantsTable.Arn
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${VehicleStateTableName}"
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UserVehicleAccessTableName}"
              - Effect: Allow
                Action: dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt ClaimsTable.Arn
                  - !GetAtt VehicleOwnershipTable.Arn
                  - !GetAtt AuditTable.Arn
                  - !GetAtt FirmwareGrantsTable.Arn
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UserVehicleAccessTableName}"
        - PolicyName: firmware-artifact
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "${FirmwareArtifactBucket.Arn}/${FirmwareArtifactKey}"
                  - !Sub "${FirmwareArtifactBucket.Arn}/${FirmwareSecondaryArtifactKey}"
        - PolicyName: firmware-user-resolution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cognito-idp:AdminGetUser
                Resource: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${OnboardingLogGroup.Arn}:*"
  OnboardingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-onboarding"
      Runtime: python3.13
      Handler: handler.handler
      Role: !GetAtt OnboardingRole.Arn
      Timeout: 10
      MemorySize: 192
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ArtifactKey}
      Environment:
        Variables:
          CLAIMS_TABLE: !Ref ClaimsTable
          OWNERSHIP_TABLE: !Ref VehicleOwnershipTable
          ACCESS_TABLE: !Ref UserVehicleAccessTableName
          AUDIT_TABLE: !Ref AuditTable
          STATE_TABLE: !Ref VehicleStateTableName
          ADMIN_GROUP: !Ref AdminGroupName
          CLAIM_TTL_SECONDS: !Ref ClaimTtlSeconds
          MAX_ATTEMPTS: !Ref MaxClaimAttempts
          AUDIT_RETENTION_DAYS: !Ref AuditRetentionDays
          CLAIM_READ_ONLY_VEHICLE_IDS: !Ref ClaimReadOnlyVehicleIds
          FIRMWARE_GRANTS_TABLE: !Ref FirmwareGrantsTable
          FIRMWARE_BUCKET: !Ref FirmwareArtifactBucket
          FIRMWARE_ARTIFACT_KEY: !Ref FirmwareArtifactKey
          FIRMWARE_TARGET: !Ref FirmwareTarget
          FIRMWARE_FLASH_SIZE_BYTES: !Ref FirmwareFlashSizeBytes
          FIRMWARE_VERSION: !Ref FirmwareVersion
          FIRMWARE_SHA256: !Ref FirmwareSha256
          FIRMWARE_SIZE: !Ref FirmwareSize
          FIRMWARE_SECONDARY_ARTIFACT_KEY: !Ref FirmwareSecondaryArtifactKey
          FIRMWARE_SECONDARY_TARGET: !Ref FirmwareSecondaryTarget
          FIRMWARE_SECONDARY_FLASH_SIZE_BYTES: !Ref FirmwareSecondaryFlashSizeBytes
          FIRMWARE_SECONDARY_VERSION: !Ref FirmwareSecondaryVersion
          FIRMWARE_SECONDARY_SHA256: !Ref FirmwareSecondarySha256
          FIRMWARE_SECONDARY_SIZE: !Ref FirmwareSecondarySize
          FIRMWARE_URL_TTL_SECONDS: !Ref FirmwareUrlTtlSeconds
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
  OnboardingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-onboarding"
      RetentionInDays: !Ref LogRetentionDays
  OnboardingApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-onboarding"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref ApiAllowedOrigin
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 300
  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref OnboardingApi
      AuthorizerType: JWT
      IdentitySource: ["$request.header.Authorization"]
      Name: cognito-jwt
      JwtConfiguration:
        Audience: [!Ref CognitoUserPoolClientId]
        Issuer: !Ref CognitoIssuerUrl
  OnboardingIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref OnboardingApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt OnboardingFunction.Arn
      PayloadFormatVersion: "2.0"
  IssueClaimRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OnboardingApi
      RouteKey: "POST /api/onboarding/claims"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${OnboardingIntegration}"
  ConsumeClaimRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OnboardingApi
      RouteKey: "POST /api/onboarding/claim"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${OnboardingIntegration}"
  FirmwareGrantRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OnboardingApi
      RouteKey: "POST /api/firmware/grants"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${OnboardingIntegration}"
  FirmwareRevokeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OnboardingApi
      RouteKey: "POST /api/firmware/grants/revoke"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${OnboardingIntegration}"
  FirmwareAccessRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OnboardingApi
      RouteKey: "GET /api/firmware/access"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${OnboardingIntegration}"
  FirmwareDownloadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OnboardingApi
      RouteKey: "POST /api/firmware/download"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${OnboardingIntegration}"
  FirmwareResultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OnboardingApi
      RouteKey: "POST /api/firmware/result"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${OnboardingIntegration}"
  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref OnboardingApi
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OnboardingFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${OnboardingApi}/*"

Outputs:
  OnboardingApiUrl:
    Value: !GetAtt OnboardingApi.ApiEndpoint
  ClaimsTableName:
    Value: !Ref ClaimsTable
  VehicleOwnershipTableName:
    Value: !Ref VehicleOwnershipTable
  AuditTableName:
    Value: !Ref AuditTable
  FirmwareGrantsTableName:
    Value: !Ref FirmwareGrantsTable
  FirmwareArtifactBucketName:
    Value: !Ref FirmwareArtifactBucket
