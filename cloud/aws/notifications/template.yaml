AWSTemplateFormatVersion: "2010-09-09"
Description: Additive MOT charging, journey and interruption notifications.

Parameters:
  ProjectName: {Type: String, Default: mot}
  Environment: {Type: String, Default: dev}
  ApiAllowedOrigin:
    Type: String
    AllowedPattern: '^(https://[^*\s]+|http://localhost(:[0-9]+)?)$'
  CognitoIssuer: {Type: String}
  CognitoAudience: {Type: String}
  AccessTableName: {Type: String}
  AccessTableArn: {Type: String}
  EventRetentionDays: {Type: Number, Default: 31, MinValue: 1, MaxValue: 31}
  LogRetentionDays: {Type: Number, Default: 7, AllowedValues: [1, 3, 5, 7, 14, 30]}
  SmsApprovalAuditRetentionDays:
    Type: Number
    Default: 90
    MinValue: 30
    MaxValue: 365
  SmsAdminPrincipalArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:[a-z0-9-]+:iam::[0-9]{12}:(user|role)/[A-Za-z0-9+=,.@_/-]+$'
    Description: Exact IAM principal allowed to assume the SMS approval administrator role.
  SmsDeliveryEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Fail-closed deployment kill switch for notification SMS delivery.
  SmsVerifiedDestinationNumberArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:[a-z0-9-]+:sms-voice:[a-z0-9-]+:[0-9]{12}:verified-destination-number/vdn-[a-f0-9]+$'
    Description: Exact verified sandbox destination authorized for the controlled pilot.
  SmsAdditionalVerifiedDestinationNumberArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:[a-z0-9-]+:sms-voice:[a-z0-9-]+:[0-9]{12}:verified-destination-number/vdn-[a-f0-9]+$'
    Description: Optional second exact verified sandbox destination for the controlled pilot.
  ReadOnlyVehicleIds:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-z0-9][a-z0-9-]{0,63}(,[a-z0-9][a-z0-9-]{0,63})*$'
    Description: Comma-separated vehicles whose notification preferences are read-only.

Conditions:
  HasSmsAdminPrincipal: !Not [!Equals [!Ref SmsAdminPrincipalArn, ""]]
  HasSmsAdditionalVerifiedDestination: !Not [!Equals [!Ref SmsAdditionalVerifiedDestinationNumberArn, ""]]

Resources:
  PreferenceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-notification-preferences"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: vehicleId, AttributeType: S}
        - {AttributeName: userSub, AttributeType: S}
      KeySchema:
        - {AttributeName: vehicleId, KeyType: HASH}
        - {AttributeName: userSub, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      Tags:
        - {Key: project, Value: !Ref ProjectName}
        - {Key: environment, Value: !Ref Environment}
        - {Key: component, Value: notifications}

  SmsApprovalTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-sms-approvals"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: vehicleId, AttributeType: S}
        - {AttributeName: userSub, AttributeType: S}
      KeySchema:
        - {AttributeName: vehicleId, KeyType: HASH}
        - {AttributeName: userSub, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      SSESpecification: {SSEEnabled: true}
      Tags:
        - {Key: project, Value: !Ref ProjectName}
        - {Key: environment, Value: !Ref Environment}
        - {Key: component, Value: sms-approvals}

  SmsApprovalAuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-sms-approval-audit"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: eventId, AttributeType: S}
      KeySchema:
        - {AttributeName: eventId, KeyType: HASH}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      SSESpecification: {SSEEnabled: true}
      Tags:
        - {Key: project, Value: !Ref ProjectName}
        - {Key: environment, Value: !Ref Environment}
        - {Key: component, Value: sms-approval-audit}

  SmsDestinationTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-sms-destinations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: destinationFingerprint, AttributeType: S}
      KeySchema:
        - {AttributeName: destinationFingerprint, KeyType: HASH}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      SSESpecification: {SSEEnabled: true}
      Tags:
        - {Key: project, Value: !Ref ProjectName}
        - {Key: environment, Value: !Ref Environment}
        - {Key: component, Value: sms-destinations}

  SmsRateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-sms-rate"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: rateKey, AttributeType: S}
      KeySchema:
        - {AttributeName: rateKey, KeyType: HASH}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      SSESpecification: {SSEEnabled: true}
      Tags:
        - {Key: project, Value: !Ref ProjectName}
        - {Key: environment, Value: !Ref Environment}
        - {Key: component, Value: sms-rate}

  SmsApprovalAdminRole:
    Type: AWS::IAM::Role
    Condition: HasSmsAdminPrincipal
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-sms-approval-admin"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {AWS: !Ref SmsAdminPrincipalArn}
            Action: [sts:AssumeRole]
      Policies:
        - PolicyName: sms-approval-admin
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource:
                  - !Ref AccessTableArn
                  - !GetAtt PreferenceTable.Arn
                  - !GetAtt SmsApprovalTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem]
                Resource:
                  - !GetAtt SmsApprovalTable.Arn
                  - !GetAtt SmsApprovalAuditTable.Arn

  SessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-notification-sessions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: vehicleId, AttributeType: S}
      KeySchema:
        - {AttributeName: vehicleId, KeyType: HASH}
      SSESpecification: {SSEEnabled: true}
      Tags:
        - {Key: project, Value: !Ref ProjectName}
        - {Key: environment, Value: !Ref Environment}
        - {Key: component, Value: notifications}

  EventTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-notification-events"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: eventId, AttributeType: S}
      KeySchema:
        - {AttributeName: eventId, KeyType: HASH}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      SSESpecification: {SSEEnabled: true}
      Tags:
        - {Key: project, Value: !Ref ProjectName}
        - {Key: environment, Value: !Ref Environment}
        - {Key: component, Value: notifications}

  EmailTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-notification-email"
      DisplayName: Microlino Open Telemetry
      Tags:
        - {Key: project, Value: !Ref ProjectName}
        - {Key: environment, Value: !Ref Environment}
        - {Key: component, Value: notifications}

  ChargingStopDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-charging-stop-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ChargingStopQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-charging-stop"
      MessageRetentionPeriod: 86400
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ChargingStopDeadLetterQueue.Arn
        maxReceiveCount: 3

  NotificationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: [lambda.amazonaws.com]}
            Action: [sts:AssumeRole]
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: notification-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Scan]
                Resource: !GetAtt SessionTable.Arn
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:Scan]
                Resource: !GetAtt PreferenceTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource:
                  - !GetAtt SmsApprovalTable.Arn
                  - !GetAtt SmsDestinationTable.Arn
              - Effect: Allow
                Action: [dynamodb:UpdateItem]
                Resource: !GetAtt SmsRateTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Scan]
                Resource: !GetAtt EventTable.Arn
              - Effect: Allow
                Action: [sns:Publish]
                Resource: !Ref EmailTopic
              - Effect: Allow
                Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt ChargingStopQueue.Arn
              - Effect: Allow
                Action: [sms-voice:SendTextMessage]
                Resource:
                  - !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:sender-id/MOT/CH"
                  - !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:sender-id/MOT/DE"
                  - !Ref SmsVerifiedDestinationNumberArn
                  - !If [HasSmsAdditionalVerifiedDestination, !Ref SmsAdditionalVerifiedDestinationNumberArn, !Ref AWS::NoValue]
                  - !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:configuration-set/mot-dev-sms"
              - Effect: Allow
                Action: [sms-voice:DescribeSpendLimits]
                Resource: "*"
              - Effect: Allow
                Action: [cloudwatch:DescribeAlarms]
                Resource: "*"

  NotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-notifications"
      Runtime: python3.12
      Handler: handler.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt NotificationRole.Arn
      Environment:
        Variables:
          PREFERENCE_TABLE_NAME: !Ref PreferenceTable
          SESSION_TABLE_NAME: !Ref SessionTable
          EVENT_TABLE_NAME: !Ref EventTable
          EMAIL_TOPIC_ARN: !Ref EmailTopic
          CHARGING_STOP_QUEUE_URL: !Ref ChargingStopQueue
          EVENT_RETENTION_DAYS: !Ref EventRetentionDays
          SMS_DELIVERY_ENABLED: !Ref SmsDeliveryEnabled
          SMS_APPROVAL_TABLE_NAME: !Ref SmsApprovalTable
          SMS_DESTINATION_TABLE_NAME: !Ref SmsDestinationTable
          SMS_RATE_TABLE_NAME: !Ref SmsRateTable
          SMS_SENDER_ARN: !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:sender-id/MOT/CH"
          SMS_SENDER_ARN_DE: !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:sender-id/MOT/DE"
          SMS_CONFIGURATION_SET: mot-dev-sms
          SMS_SPEND_ALARM_NAME: mot-dev-sms-monthly-spend-warning
          SMS_EXPECTED_SPEND_LIMIT_USD: "10"
      Code: .

  ChargingStopEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      Enabled: true
      EventSourceArn: !GetAtt ChargingStopQueue.Arn
      FunctionName: !Ref NotificationFunction

  NotificationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NotificationFunction}"
      RetentionInDays: !Ref LogRetentionDays

  IoTInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref NotificationFunction
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:rule/${ProjectName}_${Environment}_notifications"

  NotificationRule:
    Type: AWS::IoT::TopicRule
    DependsOn: [IoTInvokePermission, NotificationLogGroup]
    Properties:
      RuleName: !Sub "${ProjectName}_${Environment}_notifications"
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Sql: >-
          SELECT topic() AS mqttTopic, timestamp() AS receivedAt,
          encode(*, 'base64') AS payloadBase64 FROM 'mot/+/+/+'
          WHERE
          (topic(3) = 'charging' AND topic(4) IN ['plugged', 'is_charging', 'power_signed'])
          OR (topic(3) = 'display' AND topic(4) IN ['soc', 'odometer_km', 'speed_kmh'])
          OR (topic(3) = 'bms' AND topic(4) = 'vehicle_power_w')
          OR (topic(3) = 'status' AND topic(4) = 'online')
          OR (topic(3) = 'journey' AND topic(4) IN
          ['energy_counter_id', 'energy_drawn_wh', 'energy_regen_wh', 'energy_net_wh'])
        Actions:
          - Lambda: {FunctionArn: !GetAtt NotificationFunction.Arn}

  JourneyFinalizerRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Finalize stopped JNY-001 journeys after the stability window.
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt NotificationFunction.Arn
          Id: JourneyFinalizer

  JourneyFinalizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref NotificationFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt JourneyFinalizerRule.Arn

  DailySummarySchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: [scheduler.amazonaws.com]}
            Action: [sts:AssumeRole]
      Policies:
        - PolicyName: invoke-daily-summary
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [lambda:InvokeFunction]
                Resource: !GetAtt NotificationFunction.Arn

  DailySummarySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Retry the preceding Zurich calendar-day summary until 08:05.
      ScheduleExpression: "cron(5 0-8 * * ? *)"
      ScheduleExpressionTimezone: Europe/Zurich
      FlexibleTimeWindow: {Mode: "OFF"}
      State: ENABLED
      Target:
        Arn: !GetAtt NotificationFunction.Arn
        RoleArn: !GetAtt DailySummarySchedulerRole.Arn
        Input: '{"type":"daily_summary"}'

  PreferenceApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: [lambda.amazonaws.com]}
            Action: [sts:AssumeRole]
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: notification-preferences
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !Ref AccessTableArn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt PreferenceTable.Arn
              - Effect: Allow
                Action: [sns:Subscribe, sns:GetSubscriptionAttributes]
                Resource: !Ref EmailTopic

  PreferenceApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-notification-preferences"
      Runtime: python3.12
      Handler: preference_api.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt PreferenceApiRole.Arn
      Environment:
        Variables:
          PREFERENCE_TABLE_NAME: !Ref PreferenceTable
          ACCESS_TABLE_NAME: !Ref AccessTableName
          EMAIL_TOPIC_ARN: !Ref EmailTopic
          READ_ONLY_VEHICLE_IDS: !Ref ReadOnlyVehicleIds
      Code: .

  SmsVerificationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: [lambda.amazonaws.com]}
            Action: [sts:AssumeRole]
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: sms-destination-verification
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource:
                  - !Ref AccessTableArn
                  - !GetAtt SmsApprovalTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource:
                  - !GetAtt PreferenceTable.Arn
                  - !GetAtt SmsDestinationTable.Arn
              - Effect: Allow
                Action:
                  - sms-voice:CreateVerifiedDestinationNumber
                  - sms-voice:SendDestinationNumberVerificationCode
                  - sms-voice:VerifyDestinationNumber
                Resource: "*"
              - Effect: Allow
                Action: [sms-voice:SendTextMessage]
                Resource:
                  - !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:sender-id/MOT/CH"
                  - !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:sender-id/MOT/DE"

  SmsVerificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-sms-verification"
      Runtime: python3.12
      Handler: sms_verification_api.handler
      Timeout: 15
      MemorySize: 128
      Role: !GetAtt SmsVerificationRole.Arn
      Environment:
        Variables:
          PREFERENCE_TABLE_NAME: !Ref PreferenceTable
          ACCESS_TABLE_NAME: !Ref AccessTableName
          SMS_APPROVAL_TABLE_NAME: !Ref SmsApprovalTable
          SMS_DESTINATION_TABLE_NAME: !Ref SmsDestinationTable
          SMS_SENDER_ARN_CH: !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:sender-id/MOT/CH"
          SMS_SENDER_ARN_DE: !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:sender-id/MOT/DE"
          SMS_CONFIGURATION_SET: mot-dev-sms
          READ_ONLY_VEHICLE_IDS: !Ref ReadOnlyVehicleIds
      Code: .

  PreferenceApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-notification-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref ApiAllowedOrigin]
        AllowMethods: [GET, POST, PUT, OPTIONS]
        AllowHeaders: [content-type, authorization]
        MaxAge: 300

  PreferenceAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref PreferenceApi
      AuthorizerType: JWT
      IdentitySource: ["$request.header.Authorization"]
      JwtConfiguration:
        Audience: [!Ref CognitoAudience]
        Issuer: !Ref CognitoIssuer
      Name: !Sub "${ProjectName}-${Environment}-notification-jwt"

  PreferenceIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PreferenceApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PreferenceApiFunction.Arn
      PayloadFormatVersion: "2.0"

  PreferenceGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PreferenceApi
      RouteKey: "GET /api/vehicles/{vehicleId}/notifications"
      AuthorizationType: JWT
      AuthorizerId: !Ref PreferenceAuthorizer
      Target: !Sub "integrations/${PreferenceIntegration}"

  PreferencePutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PreferenceApi
      RouteKey: "PUT /api/vehicles/{vehicleId}/notifications"
      AuthorizationType: JWT
      AuthorizerId: !Ref PreferenceAuthorizer
      Target: !Sub "integrations/${PreferenceIntegration}"

  SmsVerificationIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PreferenceApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SmsVerificationFunction.Arn
      PayloadFormatVersion: "2.0"

  SmsVerificationGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PreferenceApi
      RouteKey: "GET /api/vehicles/{vehicleId}/notifications/sms"
      AuthorizationType: JWT
      AuthorizerId: !Ref PreferenceAuthorizer
      Target: !Sub "integrations/${SmsVerificationIntegration}"

  SmsVerificationRequestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PreferenceApi
      RouteKey: "POST /api/vehicles/{vehicleId}/notifications/sms/request"
      AuthorizationType: JWT
      AuthorizerId: !Ref PreferenceAuthorizer
      Target: !Sub "integrations/${SmsVerificationIntegration}"

  SmsVerificationConfirmRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PreferenceApi
      RouteKey: "POST /api/vehicles/{vehicleId}/notifications/sms/confirm"
      AuthorizationType: JWT
      AuthorizerId: !Ref PreferenceAuthorizer
      Target: !Sub "integrations/${SmsVerificationIntegration}"

  PreferenceStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PreferenceApi
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings: {ThrottlingBurstLimit: 5, ThrottlingRateLimit: 2}

  PreferenceInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreferenceApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PreferenceApi}/*/*"

  SmsVerificationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SmsVerificationFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PreferenceApi}/*/*"

Outputs:
  PreferenceApiBaseUrl:
    Value: !Sub "https://${PreferenceApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  PreferenceTableName: {Value: !Ref PreferenceTable}
  EmailTopicArn: {Value: !Ref EmailTopic}
  EventTableName: {Value: !Ref EventTable}
  SessionTableName: {Value: !Ref SessionTable}
  ChargingStopQueueUrl: {Value: !Ref ChargingStopQueue}
  SmsApprovalTableName: {Value: !Ref SmsApprovalTable}
  SmsApprovalAuditTableName: {Value: !Ref SmsApprovalAuditTable}
  SmsDestinationTableName: {Value: !Ref SmsDestinationTable}
  SmsRateTableName: {Value: !Ref SmsRateTable}
  SmsApprovalAuditRetentionDays: {Value: !Ref SmsApprovalAuditRetentionDays}
  SmsApprovalAdminRoleArn:
    Condition: HasSmsAdminPrincipal
    Value: !GetAtt SmsApprovalAdminRole.Arn
