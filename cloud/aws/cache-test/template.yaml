AWSTemplateFormatVersion: "2010-09-09"
Description: MOT CACHE-001 isolated SOC/Speed History-backfill test lane

Parameters:
  ProjectName:
    Type: String
    Default: mot
    AllowedPattern: "[a-z0-9-]+"
  Environment:
    Type: String
    Default: cachetest
    AllowedPattern: "[a-z0-9-]+"
  TopicRoot:
    Type: String
    Default: mot-test
    AllowedPattern: "[a-z0-9-]+"
  TestVehicleId:
    Type: String
    Default: cache-b025-n16-01
    AllowedPattern: "[A-Za-z0-9_-]+"
  RetentionDays:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 7
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14]
  MaxBatchSamples:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 120
  MaxSampleAgeSeconds:
    Type: Number
    Default: 259200
    MinValue: 300
    MaxValue: 604800
  TestCertificateArn:
    Type: String
    Default: ""
    Description: Optional existing ACTIVE certificate ARN for the dedicated test module.
  TestAckReceiveEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Isolated fault-injection switch; false suppresses device ACK delivery.
  ArtifactBucket:
    Type: String
    Description: Existing private S3 bucket containing the reviewed Lambda package.
  ArtifactKey:
    Type: String
    Description: Versioned S3 key for cache-test-backfill.zip.

Conditions:
  AttachTestCertificate: !Not [!Equals [!Ref TestCertificateArn, ""]]
  AckReceiveEnabled: !Equals [!Ref TestAckReceiveEnabled, "true"]

Resources:
  TestHistoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-vehicle-history"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: vehicleId
          AttributeType: S
        - AttributeName: sampleKey
          AttributeType: S
      KeySchema:
        - AttributeName: vehicleId
          KeyType: HASH
        - AttributeName: sampleKey
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: WorkPackage
          Value: CACHE-001
        - Key: CostBoundary
          Value: isolated-test

  BackfillRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-cache-backfill-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: bounded-history-write-and-ack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt TestHistoryTable.Arn
              - Effect: Allow
                Action: iot:Publish
                Resource: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/${TopicRoot}/${TestVehicleId}/history/backfill/ack/v1"

  BackfillFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-cache-backfill"
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt BackfillRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TOPIC_ROOT: !Ref TopicRoot
          TEST_VEHICLE_ID: !Ref TestVehicleId
          HISTORY_TABLE_NAME: !Ref TestHistoryTable
          RETENTION_DAYS: !Ref RetentionDays
          MAX_BATCH_SAMPLES: !Ref MaxBatchSamples
          MAX_SAMPLE_AGE_SECONDS: !Ref MaxSampleAgeSeconds
          MAX_FUTURE_SKEW_SECONDS: "60"
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: WorkPackage
          Value: CACHE-001
        - Key: CostBoundary
          Value: isolated-test

  BackfillLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${BackfillFunction}"
      RetentionInDays: !Ref LogRetentionDays

  IoTInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BackfillFunction
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:rule/${ProjectName}_${Environment}_cache_backfill"

  BackfillRule:
    Type: AWS::IoT::TopicRule
    DependsOn: [IoTInvokePermission, BackfillLogGroup]
    Properties:
      RuleName: !Sub "${ProjectName}_${Environment}_cache_backfill"
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Sql: !Sub >
          SELECT topic() AS mqttTopic,
                 timestamp() AS receivedAt,
                 encode(*, 'base64') AS payloadBase64
          FROM '${TopicRoot}/${TestVehicleId}/history/backfill/v1'
        Actions:
          - Lambda:
              FunctionArn: !GetAtt BackfillFunction.Arn

  TestThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: !Sub "${ProjectName}-${Environment}-${TestVehicleId}"
      AttributePayload:
        Attributes:
          environment: !Ref Environment
          vehicleId: !Ref TestVehicleId
          workPackage: CACHE-001

  TestDevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub "${ProjectName}-${Environment}-${TestVehicleId}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/${ProjectName}-${Environment}-${TestVehicleId}"
          - Effect: Allow
            Action: iot:Publish
            Resource:
              - !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/${TopicRoot}/${TestVehicleId}/history/backfill/v1"
              - !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/${TopicRoot}/${TestVehicleId}/display/*"
              - !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/${TopicRoot}/${TestVehicleId}/charging/*"
              - !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/${TopicRoot}/${TestVehicleId}/bms/*"
              - !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/${TopicRoot}/${TestVehicleId}/system/*"
              - !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/${TopicRoot}/${TestVehicleId}/status/*"
          - Effect: Allow
            Action: iot:RetainPublish
            Resource:
              - !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/${TopicRoot}/${TestVehicleId}/status/online"
              - !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/${TopicRoot}/${TestVehicleId}/system/*"
              - !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/${TopicRoot}/${TestVehicleId}/display/*"
              - !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/${TopicRoot}/${TestVehicleId}/charging/*"
              - !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/${TopicRoot}/${TestVehicleId}/bms/*"
          - Effect: Allow
            Action: iot:Subscribe
            Resource: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/${TopicRoot}/${TestVehicleId}/history/backfill/ack/v1"
          - !If
            - AckReceiveEnabled
            - Effect: Allow
              Action: iot:Receive
              Resource: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/${TopicRoot}/${TestVehicleId}/history/backfill/ack/v1"
            - !Ref AWS::NoValue

  TestPolicyAttachment:
    Type: AWS::IoT::PolicyPrincipalAttachment
    Condition: AttachTestCertificate
    Properties:
      PolicyName: !Ref TestDevicePolicy
      Principal: !Ref TestCertificateArn

  TestThingAttachment:
    Type: AWS::IoT::ThingPrincipalAttachment
    Condition: AttachTestCertificate
    Properties:
      ThingName: !Ref TestThing
      Principal: !Ref TestCertificateArn

  BackfillErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-cache-backfill-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BackfillFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  TopicRoot:
    Value: !Ref TopicRoot
  TestVehicleId:
    Value: !Ref TestVehicleId
  TestThingName:
    Value: !Ref TestThing
  TestPolicyName:
    Value: !Ref TestDevicePolicy
  HistoryTableName:
    Value: !Ref TestHistoryTable
  BackfillFunctionName:
    Value: !Ref BackfillFunction
